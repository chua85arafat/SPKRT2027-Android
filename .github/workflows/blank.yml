
name: Build SPKRT 2027 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "spkrt-2027-training-companion.zip"
      - ".github/workflows/blank.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check and extract project ZIP
        shell: bash
        run: |
          set -e

          mkdir -p source
          unzip -q spkrt-2027-training-companion.zip -d source

          SETTINGS=$(find source -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Proyek Gradle Android tidak ditemukan."
            echo "ZIP mungkin berisi proyek web, bukan proyek Android native."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: Gradle Wrapper (gradlew) tidak ditemukan."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPKRT2027-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
